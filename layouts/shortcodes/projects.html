{{- $lang := .Page.Language.Lang -}}
<div class="iponce-projects">
  {{- range hugo.Data.projects.projects }}
    {{- $description := index .description $lang | default (index .description "pt-br") }}
    <article class="iponce-project-card">
      <h2>
        {{- with .url }}<a href="{{ . }}">{{ end -}}
        {{ .name }}
        {{- with .url }}</a>{{ end -}}
      </h2>
      <p>{{ $description }}</p>
    </article>
  {{- end }}
</div>
